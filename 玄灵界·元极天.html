<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄灵界 · 元极天 — 众生皆在劫中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =================================================================
   玄灵界·元极天 — Dark Fantasy Xianxia UI System
   UI/UX Pro Max — Complete Frontend Prototype
   ================================================================= */

/* ----- CSS Custom Properties ----- */
:root {
  /* Abyss palette */
  --bg-abyss: #06040a;
  --bg-void: #0a0812;
  --bg-panel: #0e0c1a;
  --bg-card: #121022;
  --bg-elevated: #16132c;
  --bg-hover: #1c183a;

  /* Gold spectrum */
  --gold-100: #fff8e7;
  --gold-200: #f5e6b8;
  --gold-300: #e8d48b;
  --gold-400: #d4af37;
  --gold-500: #b8860b;
  --gold-600: #8b6508;
  --gold-700: #6b4c0a;
  --gold-dim: rgba(180, 130, 50, 0.25);
  --gold-glow: rgba(212, 175, 55, 0.45);
  --gold-shimmer: rgba(212, 175, 55, 0.12);

  /* Accent colors */
  --blood: #8b1a1a;
  --blood-bright: #c0392b;
  --blood-glow: rgba(192, 57, 43, 0.4);
  --jade: #1a6b3c;
  --jade-bright: #2ecc71;
  --jade-glow: rgba(46, 204, 113, 0.35);
  --amethyst: #6b3fa0;
  --amethyst-bright: #9b6dff;
  --ice: #2c5f8a;
  --ice-bright: #4da6ff;

  /* Text */
  --text-primary: #d4c5a9;
  --text-secondary: #9d8f7a;
  --text-dim: #6b5f52;
  --text-muted: #3d3745;

  /* Borders */
  --border-subtle: rgba(180, 130, 50, 0.12);
  --border-default: rgba(180, 130, 50, 0.22);
  --border-gold: rgba(212, 175, 55, 0.35);
  --border-bright: rgba(212, 175, 55, 0.55);
  --border-danger: rgba(192, 57, 43, 0.35);

  /* Radius */
  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 14px;

  /* Transitions */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring: cubic-bezier(0.25, 0.46, 0.45, 1.4);
  --duration-fast: 120ms;
  --duration-base: 250ms;
  --duration-slow: 500ms;
  --duration-glacial: 900ms;

  /* Typography */
  --font-display: 'Noto Serif SC', 'SimSun', 'STSong', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5), 0 0 1px rgba(212,175,55,0.1);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6), 0 0 8px rgba(212,175,55,0.12);
  --shadow-xl: 0 16px 64px rgba(0,0,0,0.7), 0 0 20px rgba(212,175,55,0.15);
  --shadow-gold: 0 0 20px rgba(212,175,55,0.25), 0 0 60px rgba(212,175,55,0.08);
  --shadow-blood: 0 0 16px rgba(192,57,43,0.3);

  /* Layout */
  --sidebar-width: 200px;
  --sidebar-collapsed: 60px;
}

/* ----- Reset & Base ----- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--bg-abyss);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.7;
  overflow-x: hidden;
  letter-spacing: 0.02em;
}

/* ----- Multi-Layer Background System ----- */
.bg-abyss {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.bg-abyss-layer-1 {
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(139, 0, 0, 0.07) 0%, transparent 60%),
    radial-gradient(ellipse at 75% 60%, rgba(100, 60, 0, 0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 85%, rgba(0, 60, 80, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 50%, rgba(60, 20, 80, 0.04) 0%, transparent 60%);
  animation: bg-drift 40s ease-in-out infinite;
}

.bg-abyss-layer-2 {
  position: absolute;
  inset: -5%;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(212,175,55,0.015) 2px, rgba(212,175,55,0.015) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(180,130,50,0.02) 80px, rgba(180,130,50,0.02) 81px);
  animation: bg-scroll 60s linear infinite;
}

.bg-abyss-layer-3 {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 60% 40%, rgba(212,175,55,0.04) 0%, transparent 30%),
    radial-gradient(circle at 20% 70%, rgba(192,57,43,0.03) 0%, transparent 25%),
    radial-gradient(circle at 80% 20%, rgba(46,204,113,0.02) 0%, transparent 20%);
  animation: bg-pulse 8s ease-in-out infinite alternate;
}

/* Star particles */
.bg-stars {
  position: absolute;
  inset: 0;
}
.bg-star {
  position: absolute;
  width: 1.5px;
  height: 1.5px;
  background: var(--gold-400);
  border-radius: 50%;
  animation: star-twinkle var(--twinkle-dur, 3s) ease-in-out infinite;
  animation-delay: var(--twinkle-delay, 0s);
  opacity: var(--twinkle-opacity, 0.4);
}

/* Floating ink/ash particles */
.bg-ash-container {
  position: absolute;
  inset: 0;
}
.bg-ash {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(180,130,50,0.3);
  border-radius: 1px;
  animation: ash-rise var(--ash-dur, 14s) linear infinite;
  animation-delay: var(--ash-delay, 0s);
  left: var(--ash-x, 50%);
}

/* Black sea scale pattern overlay */
.bg-scale-overlay {
  position: absolute;
  inset: 0;
  opacity: 0.02;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 2 Q45 15 30 28 Q15 15 30 2z' fill='none' stroke='%23d4af37' stroke-width='0.5'/%3E%3Cpath d='M30 32 Q45 45 30 58 Q15 45 30 32z' fill='none' stroke='%23d4af37' stroke-width='0.5'/%3E%3C/svg%3E");
  background-size: 60px 60px;
}

/* ----- Layout ----- */
.app-layout {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.app-main {
  flex: 1;
  margin-left: var(--sidebar-width);
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ----- Sidebar Navigation ----- */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--sidebar-width);
  background: linear-gradient(175deg, rgba(14,12,26,0.97) 0%, rgba(10,8,18,0.98) 40%, rgba(6,4,10,0.99) 100%);
  border-right: 1px solid var(--border-subtle);
  z-index: 100;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 2px 0 30px rgba(0,0,0,0.4);
  transition: width var(--duration-slow) var(--ease-out-expo);
}

.sidebar::after {
  content: '';
  position: absolute;
  right: -1px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent 0%, var(--gold-400) 30%, var(--gold-400) 70%, transparent 100%);
  opacity: 0.3;
  animation: sidebar-glow-line 4s ease-in-out infinite;
}

/* Sidebar header */
.sidebar-header {
  padding: 28px 20px 16px;
  text-align: center;
  position: relative;
}
.sidebar-logo {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.18em;
  background: linear-gradient(180deg, #f5e6b8 0%, #d4af37 40%, #8b6508 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(212,175,55,0.4));
  line-height: 1.3;
}
.sidebar-subtitle {
  display: block;
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.25em;
  margin-top: 2px;
}
.sidebar-divider {
  height: 1px;
  margin: 8px 20px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
  opacity: 0.4;
}

/* Nav items */
.sidebar-nav {
  flex: 1;
  list-style: none;
  padding: 4px 10px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 16px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 400;
  cursor: pointer;
  transition: all var(--duration-base) var(--ease-out-expo);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.04em;
  text-align: left;
}
.nav-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(212,175,55,0.08), transparent 70%);
  opacity: 0;
  transition: opacity var(--duration-base) var(--ease-out-expo);
}
.nav-item:hover {
  color: var(--text-primary);
  background: rgba(212,175,55,0.04);
  transform: translateX(3px);
}
.nav-item:hover::before { opacity: 1; }
.nav-item:active { transform: scale(0.98); }

.nav-item--active {
  color: #e8d48b;
  background: linear-gradient(90deg, rgba(212,175,55,0.12) 0%, rgba(212,175,55,0.03) 60%, transparent 100%);
  font-weight: 500;
  text-shadow: 0 0 16px rgba(212,175,55,0.25);
}
.nav-item--active::after {
  content: '';
  position: absolute;
  left: 0;
  top: 25%;
  height: 50%;
  width: 2px;
  background: var(--gold-400);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 10px var(--gold-glow);
}
.nav-icon {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  opacity: 0.7;
  transition: opacity var(--duration-base) var(--ease-out-expo);
}
.nav-item:hover .nav-icon, .nav-item--active .nav-icon { opacity: 1; }
.nav-label { white-space: nowrap; }

/* Sidebar footer */
.sidebar-footer {
  padding: 12px 20px 20px;
  text-align: center;
}
.sidebar-footer-text {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.2em;
}

/* ----- Main Content Panel System ----- */
.panel {
  display: none;
  min-height: 100vh;
  padding: 36px 44px;
  animation: panel-enter 0.45s var(--ease-out-expo);
}
.panel--active { display: block; }

@keyframes panel-enter {
  from { opacity: 0; transform: translateY(16px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* Panel header */
.panel-header {
  margin-bottom: 32px;
  position: relative;
}
.panel-title {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(180deg, #f0d890 0%, #c4a030 50%, #8b6910 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 8px rgba(212,175,55,0.2));
  margin-bottom: 6px;
}
.panel-subtitle {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  padding-left: 4px;
}
.panel-title-decoration {
  display: inline-block;
  width: 36px;
  height: 2px;
  background: linear-gradient(90deg, var(--gold-400), transparent);
  margin-right: 12px;
  vertical-align: middle;
  border-radius: 1px;
  box-shadow: 0 0 8px rgba(212,175,55,0.3);
}

/* ----- Character Monitor Panel ----- */
.char-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 40px;
}

.char-card {
  background: linear-gradient(175deg, var(--bg-card) 0%, var(--bg-panel) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--duration-base) var(--ease-out-expo);
  box-shadow: var(--shadow-md);
}
.char-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-xl);
  border: 1px solid transparent;
  background: linear-gradient(135deg, rgba(212,175,55,0.15) 0%, transparent 40%, rgba(180,130,50,0.05) 100%) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity var(--duration-base) var(--ease-out-expo);
}
.char-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-xl), var(--shadow-gold);
  border-color: var(--border-gold);
}
.char-card:hover::before { opacity: 1; }
.char-card:active { transform: scale(0.98) translateY(-3px); }

.char-card--danger {
  border-color: var(--border-danger) !important;
  box-shadow: var(--shadow-md), var(--shadow-blood);
  animation: danger-pulse 3s ease-in-out infinite;
}

.char-card-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 900;
  position: relative;
  z-index: 1;
}
.char-card-avatar::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid var(--border-gold);
  animation: avatar-ring 3s ease-in-out infinite;
}
.char-card-avatar--gold { color: #d4af37; background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(100,60,0,0.1)); }
.char-card-avatar--ice { color: #4da6ff; background: linear-gradient(135deg, rgba(77,166,255,0.15), rgba(40,80,120,0.1)); }
.char-card-avatar--jade { color: #2ecc71; background: linear-gradient(135deg, rgba(46,204,113,0.15), rgba(20,80,40,0.1)); }
.char-card-avatar--amethyst { color: #9b6dff; background: linear-gradient(135deg, rgba(155,109,255,0.15), rgba(60,30,100,0.1)); }

.char-card-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.08em;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.char-card-title {
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}
.char-card-location {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 16px;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

/* Six-dimension stat bars */
.stat-list { display: flex; flex-direction: column; gap: 8px; }
.stat-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-label {
  width: 36px;
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  flex-shrink: 0;
  letter-spacing: 0.05em;
}
.stat-track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.04);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.stat-fill {
  height: 100%;
  border-radius: 2px;
  position: relative;
  transition: width 1.2s var(--ease-out-expo);
}
.stat-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: bar-shimmer 2.5s ease-in-out infinite;
}
.stat-fill--gold { background: linear-gradient(90deg, #8b6508, #d4af37); }
.stat-fill--blood { background: linear-gradient(90deg, #6b1010, #c0392b); }
.stat-fill--jade { background: linear-gradient(90deg, #0f5c2e, #2ecc71); }
.stat-fill--ice { background: linear-gradient(90deg, #1a4a6e, #4da6ff); }
.stat-fill--amethyst { background: linear-gradient(90deg, #4a2080, #9b6dff); }
.stat-fill--gold-warm { background: linear-gradient(90deg, #8b5a08, #e8a817); }
.stat-value {
  width: 36px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

/* Danger overlay */
.char-card-danger-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--blood-bright);
  padding: 2px 8px;
  border: 1px solid var(--blood);
  border-radius: 2px;
  background: rgba(192,57,43,0.08);
  animation: danger-blink 2s ease-in-out infinite;
}

/* Section headings */
.section-heading {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-400);
  letter-spacing: 0.08em;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-heading::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--gold-400);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--gold-glow);
}

/* ----- Dual Map System ----- */
.map-container {
  position: relative;
  background: linear-gradient(175deg, rgba(14,12,26,0.8), rgba(10,8,18,0.9));
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.map-toolbar {
  display: flex;
  gap: 6px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(6,4,10,0.6);
  backdrop-filter: blur(6px);
}
.map-toggle-btn {
  padding: 7px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 12.5px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out-expo);
  letter-spacing: 0.05em;
}
.map-toggle-btn:hover { color: var(--text-primary); border-color: var(--border-gold); background: rgba(212,175,55,0.05); }
.map-toggle-btn--active {
  color: var(--gold-400);
  border-color: var(--border-gold);
  background: rgba(212,175,55,0.08);
  box-shadow: 0 0 10px rgba(212,175,55,0.1);
}

.map-stage {
  position: relative;
  width: 100%;
  min-height: 520px;
  overflow: hidden;
}

/* Macro map (realm view) */
.map-macro {
  position: relative;
  width: 100%;
  height: 520px;
}
.map-macro svg { width: 100%; height: 100%; }

.realm-node {
  cursor: pointer;
  transition: transform var(--duration-base) var(--ease-out-expo), filter var(--duration-base) var(--ease-out-expo);
}
.realm-node:hover { transform: scale(1.4); filter: drop-shadow(0 0 16px rgba(212,175,55,0.6)); }
.realm-node--corrupted { animation: corruption-flicker 4s ease-in-out infinite; }

.realm-label {
  font-family: var(--font-display);
  font-size: 13px;
  fill: var(--text-primary);
  pointer-events: none;
  letter-spacing: 0.06em;
}

.ley-line {
  stroke: rgba(212,175,55,0.2);
  stroke-width: 1;
  stroke-dasharray: 6 4;
  animation: ley-line-flow 10s linear infinite;
}

/* Character tokens on map */
.char-token {
  position: absolute;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  transition: all var(--duration-base) var(--ease-out-expo);
  z-index: 10;
  animation: token-float 3s ease-in-out infinite;
}
.char-token:hover {
  transform: scale(1.5);
  z-index: 20;
}
.char-token--gold {
  background: radial-gradient(circle, rgba(212,175,55,0.4), rgba(100,60,0,0.6));
  border: 2px solid var(--gold-400);
  box-shadow: 0 0 16px var(--gold-glow);
  color: #fff;
}
.char-token--ice {
  background: radial-gradient(circle, rgba(77,166,255,0.4), rgba(30,70,110,0.6));
  border: 2px solid #4da6ff;
  box-shadow: 0 0 16px rgba(77,166,255,0.4);
  color: #fff;
}
.char-token--jade {
  background: radial-gradient(circle, rgba(46,204,113,0.4), rgba(20,80,40,0.6));
  border: 2px solid #2ecc71;
  box-shadow: 0 0 16px rgba(46,204,113,0.4);
  color: #fff;
}
.char-token--amethyst {
  background: radial-gradient(circle, rgba(155,109,255,0.4), rgba(70,40,120,0.6));
  border: 2px solid #9b6dff;
  box-shadow: 0 0 16px rgba(155,109,255,0.4);
  color: #fff;
}

/* Micro map (scene view) */
.map-micro {
  position: relative;
  width: 100%;
  height: 520px;
  background: radial-gradient(ellipse at center, rgba(20,15,30,0.6) 0%, rgba(6,4,10,0.95) 70%);
  overflow: hidden;
}
.map-micro-canvas {
  width: 100%;
  height: 100%;
}

/* Map tooltip */
.map-tooltip {
  position: absolute;
  padding: 14px 18px;
  background: rgba(14,12,26,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-out-expo);
  box-shadow: var(--shadow-xl);
  max-width: 280px;
}
.map-tooltip--visible { opacity: 1; }
.map-tooltip-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--gold-400);
  margin-bottom: 4px;
  letter-spacing: 0.06em;
}
.map-tooltip-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* ----- Inventory / Skill Tree / Settings Grid ----- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.info-card {
  background: linear-gradient(170deg, var(--bg-card) 0%, var(--bg-panel) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all var(--duration-base) var(--ease-out-expo);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.info-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-gold);
  box-shadow: var(--shadow-lg), 0 0 16px rgba(212,175,55,0.08);
}
.info-card:active { transform: scale(0.98); }
.info-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.04), transparent);
  transition: left 0.6s ease;
}
.info-card:hover::after { left: 100%; }

.info-card-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.info-card-grade {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--gold-500);
  border-radius: 2px;
  color: var(--gold-400);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  background: rgba(180,130,50,0.06);
}
.info-card-desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state-icon {
  font-family: var(--font-display);
  font-size: 48px;
  opacity: 0.15;
  margin-bottom: 16px;
}
.empty-state-text {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.empty-state-desc {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

/* ----- Modal / Drawer System ----- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3,2,6,0.82);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: overlay-in 0.25s var(--ease-out-expo);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-base) var(--ease-out-expo);
}
.modal-overlay--visible { opacity: 1; pointer-events: auto; }

.modal {
  background: linear-gradient(175deg, var(--bg-panel) 0%, var(--bg-card) 100%);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-xl);
  padding: 36px;
  max-width: 640px;
  width: 90vw;
  max-height: 82vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl), var(--shadow-gold);
  position: relative;
  animation: modal-enter 0.4s var(--ease-out-back);
}
.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-subtle);
  border-radius: 50%;
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out-expo);
}
.modal-close:hover { color: var(--text-primary); border-color: var(--border-gold); background: rgba(212,175,55,0.06); }
.modal-header {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  color: var(--gold-400);
  letter-spacing: 0.08em;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-body { font-size: 14px; color: var(--text-secondary); line-height: 1.8; }
.modal-body strong { color: var(--text-primary); }

/* Drawer (slide from right) */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3,2,6,0.6);
  z-index: 200;
  animation: overlay-in 0.2s var(--ease-out-expo);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-base) var(--ease-out-expo);
}
.drawer-overlay--visible { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: 420px;
  max-width: 92vw;
  background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-abyss) 100%);
  border-left: 1px solid var(--border-gold);
  padding: 32px 28px;
  overflow-y: auto;
  z-index: 201;
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  transform: translateX(100%);
  transition: transform 0.4s var(--ease-out-expo);
}
.drawer--visible { transform: translateX(0); }
.drawer-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-subtle);
  border-radius: 50%;
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out-expo);
}
.drawer-close:hover { color: var(--text-primary); border-color: var(--border-gold); }

/* ----- Toast / Notification System ----- */
.toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  min-width: 340px;
  max-width: 460px;
  padding: 16px 20px;
  background: rgba(14,12,26,0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-xl);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  animation: toast-in 0.45s var(--ease-out-back);
  transition: all var(--duration-base) var(--ease-out-expo);
  position: relative;
  overflow: hidden;
}
.toast::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
}
.toast--success::before { background: var(--jade-bright); }
.toast--warning::before { background: #e67e22; }
.toast--danger::before { background: var(--blood-bright); }
.toast--info::before { background: var(--gold-400); }
.toast--fade-out { opacity: 0; transform: translateX(100px); }

.toast-icon { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; }
.toast-content { flex: 1; }
.toast-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.toast-message {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
}

/* ----- Buttons ----- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13.5px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out-expo);
  letter-spacing: 0.04em;
  position: relative;
  overflow: hidden;
}
.btn:hover {
  color: var(--text-primary);
  border-color: var(--border-gold);
  box-shadow: 0 0 14px var(--gold-shimmer);
}
.btn:active { transform: scale(0.97); }
.btn--primary {
  background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(180,130,50,0.06));
  border-color: var(--border-gold);
  color: var(--gold-400);
  font-weight: 500;
}
.btn--primary:hover {
  background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(180,130,50,0.1));
  box-shadow: var(--shadow-gold);
}
.btn--danger { border-color: var(--border-danger); color: var(--blood-bright); }
.btn--danger:hover { background: rgba(192,57,43,0.08); box-shadow: var(--shadow-blood); }
.btn--sm { padding: 6px 14px; font-size: 12px; }

/* ----- Form Elements ----- */
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: rgba(10,8,18,0.6);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  transition: all var(--duration-fast) var(--ease-out-expo);
  outline: none;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--border-gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,0.08);
}
.form-textarea { resize: vertical; min-height: 100px; font-family: var(--font-mono); font-size: 12px; }
.form-select { cursor: pointer; }

/* ----- Scollbar ----- */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(180,130,50,0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(180,130,50,0.3); }

/* ----- Chat/Game Interface ----- */
.chat-container {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 140px);
  max-width: 780px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-bubble {
  max-width: 78%;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  line-height: 1.8;
  font-size: 15px;
  animation: msg-enter 0.35s var(--ease-out-expo);
}
.chat-bubble--user {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(120,80,180,0.15), rgba(100,60,160,0.06));
  border: 1px solid rgba(155,109,255,0.2);
  border-radius: 12px 12px 4px 12px;
}
.chat-bubble--assistant {
  align-self: flex-start;
  background: linear-gradient(135deg, rgba(20,15,30,0.8), rgba(16,12,26,0.6));
  border: 1px solid var(--border-subtle);
  border-radius: 12px 12px 12px 4px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.chat-input-area {
  display: flex;
  gap: 10px;
  padding: 16px 0;
  border-top: 1px solid var(--border-subtle);
}
.chat-input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-md);
  background: var(--bg-panel);
  color: var(--text-primary);
  font-family: var(--font-display);
  font-size: 15px;
  outline: none;
  transition: all var(--duration-fast) var(--ease-out-expo);
  resize: none;
}
.chat-input:focus {
  border-color: var(--gold-400);
  box-shadow: 0 0 20px rgba(212,175,55,0.15);
}

.streaming-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  color: var(--gold-400);
  font-size: 13px;
}
.streaming-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-400);
  animation: streaming-bounce 1s ease-in-out infinite;
}
.streaming-dot:nth-child(2) { animation-delay: 0.15s; }
.streaming-dot:nth-child(3) { animation-delay: 0.3s; }

/* Options */
.chat-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 12px 0;
}
.chat-option-btn {
  text-align: left;
  padding: 12px 18px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: rgba(212,175,55,0.03);
  color: var(--text-secondary);
  font-family: var(--font-display);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out-expo);
  letter-spacing: 0.03em;
}
.chat-option-btn:hover {
  border-color: var(--border-gold);
  background: rgba(212,175,55,0.08);
  color: var(--gold-400);
  transform: translateX(6px);
  box-shadow: 0 0 16px rgba(212,175,55,0.08);
}

/* Thinking fold */
.thinking-fold { margin: 8px 0; }
.thinking-fold summary {
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  letter-spacing: 0.05em;
  padding: 4px 0;
  transition: color var(--duration-fast);
  list-style: none;
}
.thinking-fold summary:hover { color: var(--text-dim); }
.thinking-fold .content {
  font-size: 13px;
  color: var(--text-dim);
  padding: 10px 14px;
  background: rgba(255,255,255,0.015);
  border-radius: var(--radius-md);
  white-space: pre-wrap;
  max-height: 180px;
  overflow-y: auto;
  border-left: 2px solid var(--border-subtle);
  font-style: italic;
  margin-top: 4px;
}

/* =================================================================
   KEYFRAMES
   ================================================================= */
@keyframes bg-drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(1%, -0.5%) scale(1.02); }
  50% { transform: translate(-0.5%, 1%) scale(1.01); }
  75% { transform: translate(-1%, -1%) scale(1.03); }
}
@keyframes bg-scroll {
  from { transform: translateY(0); }
  to { transform: translateY(-80px); }
}
@keyframes bg-pulse {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}
@keyframes ash-rise {
  0% { transform: translateY(105vh) translateX(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.2; }
  100% { transform: translateY(-5vh) translateX(var(--ash-drift, 20px)); opacity: 0; }
}
@keyframes sidebar-glow-line {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.5; }
}
@keyframes avatar-ring {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}
@keyframes danger-pulse {
  0%, 100% { box-shadow: var(--shadow-md), 0 0 8px rgba(192,57,43,0.2); }
  50% { box-shadow: var(--shadow-md), 0 0 20px rgba(192,57,43,0.45); }
}
@keyframes danger-blink {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
@keyframes bar-shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
@keyframes corruption-flicker {
  0%, 90%, 100% { opacity: 1; }
  92%, 96% { opacity: 0.4; }
}
@keyframes ley-line-flow {
  from { stroke-dashoffset: 100; }
  to { stroke-dashoffset: 0; }
}
@keyframes token-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modal-enter {
  from { opacity: 0; transform: scale(0.92) translateY(24px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translateX(120px) scale(0.9); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes msg-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes streaming-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes gold-shine {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

/* =================================================================
   RESPONSIVE
   ================================================================= */
@media (max-width: 1200px) {
  .char-grid { grid-template-columns: repeat(2, 1fr); }

  .panel { padding: 20px; }
  .panel-title { font-size: 24px; }
  .char-grid { grid-template-columns: 1fr; }
  .drawer { width: 100vw; }
}

let activePanel = 'monitor';

/* ===================================================================
   INITIALIZATION
   =================================================================== */
function init() {
  renderBackgroundParticles();
  renderSidebar();
  switchPanel('monitor');
}

/* ----- Background Particles ----- */
function renderBackgroundParticles() {
  const starsEl = document.getElementById('bg-stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'bg-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--twinkle-dur', (2 + Math.random() * 5) + 's');
    star.style.setProperty('--twinkle-delay', Math.random() * 4 + 's');
    star.style.setProperty('--twinkle-opacity', (0.15 + Math.random() * 0.5).toString());
    starsEl.appendChild(star);
  }

  const ashEl = document.getElementById('bg-ash');
  for (let i = 0; i < 25; i++) {
    const ash = document.createElement('div');
    ash.className = 'bg-ash';
    ash.style.setProperty('--ash-x', Math.random() * 100 + '%');
    ash.style.setProperty('--ash-dur', (10 + Math.random() * 20) + 's');
    ash.style.setProperty('--ash-delay', Math.random() * 10 + 's');
    ash.style.setProperty('--ash-drift', (Math.random() - 0.5) * 60 + 'px');
    ashEl.appendChild(ash);
  }
}

/* ----- Sidebar Navigation ----- */
function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <li>
      <button class="nav-item${activePanel === item.id ? ' nav-item--active' : ''}"
              id="nav-${item.id}"
              onclick="switchPanel('${item.id}')"
              aria-current="${activePanel === item.id ? 'page' : 'false'}">
        <span class="nav-icon">${ICONS[item.icon]}</span>
        <span class="nav-label">${item.label}</span>
      </button>
    </li>
  `).join('');
}

function updateNavActive() {
  document.querySelectorAll('.nav-item').forEach(btn => {
    const isActive = btn.id === 'nav-' + activePanel;
    btn.classList.toggle('nav-item--active', isActive);
    btn.setAttribute('aria-current', isActive ? 'page' : 'false');
  });
}

/* ----- Panel Switching ----- */
function switchPanel(id) {
  activePanel = id;
  updateNavActive();
  const main = document.getElementById('app-main');
  switch (id) {
    case 'monitor': main.innerHTML = renderMonitorPanel(); break;
    case 'map': main.innerHTML = renderMapPanel(); break;
    case 'skills': main.innerHTML = renderSkillsPanel(); break;
    case 'inventory': main.innerHTML = renderInventoryPanel(); break;
    case 'chat': main.innerHTML = renderChatPanel(); break;
    case 'settings': main.innerHTML = renderSettingsPanel(); break;
  }
  // Re-initialize panel-specific scripts
  if (id === 'map') initMapPanel();
  if (id === 'chat') initChatPanel();
}

/* ----- Macro Map (Realm View) ----- */
function renderMacroMap() {
  const realms = WORLD_DATA.realms;
  const positions = WORLD_DATA.characterPositions;
  const w = 800, h = 520;

  // Connection lines
  const linesHTML = realms.flatMap(r =>
    r.connections.map(cid => {
      const target = realms.find(r2 => r2.id === cid);
      if (!target) return '';
      return `<line x1="${r.x/100*w}" y1="${r.y/100*h}" x2="${target.x/100*w}" y2="${target.y/100*h}" class="ley-line"/>`;
    })
  ).join('');

  // Realm nodes
  const nodesHTML = realms.map(r => `
    <g class="realm-node${r.corrupted ? ' realm-node--corrupted' : ''}" id="realm-${r.id}"
       transform="translate(${r.x/100*w}, ${r.y/100*h})"
       onmouseenter="showMapTooltip(event, '${r.name}', '${r.desc.replace(/'/g, "\\'")}')"
       onmouseleave="hideMapTooltip()"
       onclick="openRealmModal('${r.id}')">
      ${r.corrupted
        ? `<polygon points="0,-22 20,-6 12,18 -12,18 -20,-6" fill="rgba(139,0,0,0.2)" stroke="#8b0000" stroke-width="1.5"/>`
        : `<polygon points="0,-22 20,-6 12,18 -12,18 -20,-6" fill="rgba(212,175,55,0.08)" stroke="#d4af37" stroke-width="1.5"/>`
      }
      <text y="6" text-anchor="middle" class="realm-label" font-size="12">${r.name}</text>
    </g>
  `).join('');

  // Character tokens on macro map
  const tokensHTML = Object.entries(positions).map(([charId, pos]) => {
    const char = WORLD_DATA.characters.find(c => c.id === charId);
    if (!char) return '';
    const realm = realms.find(r => r.id === pos.realmId);
    if (!realm) return '';
    const rx = realm.x / 100 * w, ry = realm.y / 100 * h;
    const offsets = { luxingyao: [-24, -24], limingyuan: [18, -20], yexilan: [22, 18], chulingshuang: [-20, 20] };
    const [ox, oy] = offsets[charId] || [0, 0];
    return `
      <g transform="translate(${rx + ox}, ${ry + oy})">
        <circle r="14" fill="rgba(0,0,0,0.5)" stroke="${char.tokenClass.includes('gold') ? '#d4af37' : char.tokenClass.includes('ice') ? '#4da6ff' : char.tokenClass.includes('jade') ? '#2ecc71' : '#9b6dff'}" stroke-width="1.5"/>
        <text y="5" text-anchor="middle" font-family="var(--font-display)" font-size="13" font-weight="900" fill="#fff">${char.name[0]}</text>
      </g>
    `;
  }).join('');

  return `
    <div class="map-macro" id="map-macro">
      <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sea-corruption" cx="48%" cy="43%"><stop offset="0%" stop-color="rgba(139,0,0,0.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
        </defs>
        <rect width="${w}" height="${h}" fill="url(#sea-corruption)"/>
        ${linesHTML}
        ${nodesHTML}
        ${tokensHTML}
        <!-- Legend -->
        <g transform="translate(640, 470)">
          <rect x="0" y="0" width="140" height="40" rx="4" fill="rgba(6,4,10,0.7)" stroke="rgba(180,130,50,0.15)"/>
          <circle cx="15" cy="14" r="4" fill="rgba(212,175,55,0.3)" stroke="#d4af37" stroke-width="1"/>
          <text x="26" y="18" font-size="10" fill="#9d8f7a" font-family="var(--font-body)">角色令牌</text>
          <polygon points="80,10 88,14 80,18" fill="rgba(139,0,0,0.3)" stroke="#8b0000" stroke-width="1" transform="translate(0,4)"/>
          <text x="96" y="18" font-size="10" fill="#9d8f7a" font-family="var(--font-body)">黑海侵蚀</text>
        </g>
      </svg>
    </div>
  `;
}

/* ----- Map Tooltip ----- */
function showMapTooltip(e, title, desc) {
  const tt = document.getElementById('map-tooltip');
  if (!tt) return;
  document.getElementById('map-tooltip-title').textContent = title;
  document.getElementById('map-tooltip-desc').textContent = desc;
  tt.style.left = (e.clientX + 18) + 'px';
  tt.style.top = (e.clientY - 60) + 'px';
  tt.classList.add('map-tooltip--visible');
}
function hideMapTooltip() {
  const tt = document.getElementById('map-tooltip');
  if (tt) tt.classList.remove('map-tooltip--visible');
}

function sendChatMessage(text) {
  if (!text || !text.trim()) return;
  const trimmed = text.trim();
  // Add user message
  currentChat.push({ role: 'user', content: trimmed });
  // Simulate streaming response
  const responses = [
    '天道运转，因果交织。你的选择已经惊动了冥冥中的存在——黑海深处，有什么东西正在苏醒。\n\n<thinking>玩家选择了主动出击，这会影响后续的因果走向。黑海异兽对灵力波动的敏感度可能比预想中更高。</thinking>\n\n<maintext>陆星遥握紧了手中的剑，感受到剑身上传来的微微震颤——那是碎星剑诀在共鸣。「不能再等了。」他低声道，眼中闪过一丝金色的剑芒。\n\n李明远沉默了片刻，然后重重点头：「我去召集人手。这一次，我们要杀入裂隙深处。」</maintext>\n\n<option>立即出发，趁黑海异兽尚未完全集结\n先前往太虚剑碑感悟碎星剑诀第六式\n寻找玄钟，请求太古神山的力量加持</option>\n\n<sum>决定深入黑海裂隙营救叶汐澜，李明远将召集人手。</sum>',
  ];
  const response = responses[Math.floor(Math.random() * responses.length)];
  currentChat.push({ role: 'assistant', content: response });

  // Re-render chat panel
  const main = document.getElementById('app-main');
  main.innerHTML = renderChatPanel();
  initChatPanel();

  showToast('success', '天机已应', '因果长河中泛起新的涟漪…');
}

/* ===================================================================
   JSON IMPORT / EXPORT
   =================================================================== */

// Track what we're importing
let importType = 'preset';

function triggerImport(type) {
  importType = type;
  document.getElementById('import-file-input').click();
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      processImport(data, importType);
    } catch (err) {
      showToast('danger', '导入失败', 'JSON 格式解析错误：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function processImport(data, type) {
  const statusEl = document.getElementById('import-status');
  if (!statusEl) return;

  try {
    // Handle SillyTavern lorebook format
    if (type === 'lorebook' || (data.entries && typeof data.entries === 'object')) {
      const name = data.name || '导入的世界书';
      const entries = Array.isArray(data.entries) ? data.entries : Object.values(data.entries);
      statusEl.innerHTML = `<span style="color:var(--jade-bright)">✓ 成功导入世界书「${name}」— ${entries.length} 条词条</span>`;
      showToast('success', '世界书已导入', `「${name}」包含 ${entries.length} 条世界法则`);
    }
    // Handle SillyTavern preset format
    else if (type === 'preset' || data.settings || data.prompts) {
      const name = data.name || '导入的预设';
      statusEl.innerHTML = `<span style="color:var(--jade-bright)">✓ 成功导入预设「${name}」</span>`;
      showToast('success', '预设已导入', `「${name}」已加入天道法则`);
    }
    // Handle backup
    else if (type === 'backup' || data.version || data.lorebooks) {
      const lbCount = data.lorebooks?.length || 0;
      const pCount = data.presets?.length || 0;
      statusEl.innerHTML = `<span style="color:var(--jade-bright)">✓ 备份已恢复 — ${lbCount} 本世界书, ${pCount} 个预设</span>`;
      showToast('success', '备份已恢复', `恢复了 ${lbCount} 本世界书与 ${pCount} 个预设`);
    }
    else {
      statusEl.innerHTML = `<span style="color:var(--jade-bright)">✓ 数据已导入</span>`;
      showToast('info', '导入完成', 'JSON 数据已成功加载');
    }
  } catch (err) {
    statusEl.innerHTML = `<span style="color:var(--blood-bright)">✘ 导入处理失败：${err.message}</span>`;
    showToast('danger', '导入失败', err.message);
  }
}

function exportAllData() {
  const exportData = {
    version: '3.0.0',
    name: '玄灵界·元极天 数据备份',
    exportedAt: new Date().toISOString(),
    characters: WORLD_DATA.characters,
    realms: WORLD_DATA.realms,
    inventory: WORLD_DATA.inventory,
    skillTree: WORLD_DATA.skillTree,
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '玄灵界·元极天_数据备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('success', '导出成功', '天道法则已导出为 JSON 文件');
}

function resetAllData() {
  openModal(
    '重置天道法则',
    '<p style="color:var(--blood-bright);margin-bottom:16px;">此操作将清除所有本地数据，包括已导入的世界书、预设和对话记录。此操作不可撤销。</p>' +
    '<p style="color:var(--text-dim);margin-bottom:20px;">重置后将恢复为初始的玄灵界数据。</p>' +
    '<div style="display:flex;gap:10px;">' +
    '<button class="btn btn--danger" id="btn-confirm-reset" onclick="confirmReset()">确认重置</button>' +
    '<button class="btn" id="btn-cancel-reset" onclick="closeModal()">取消</button>' +
    '</div>'
  );
}

function confirmReset() {
  closeModal();
  showToast('info', '天道重置', '天地法则已回归原初状态');
}

/* ===================================================================
   DRAWER SYSTEM
   =================================================================== */
function openCharDrawer(charId) {
  const char = WORLD_DATA.characters.find(c => c.id === charId);
  if (!char) return;
  const overlay = document.getElementById('drawer-overlay');
  const content = document.getElementById('drawer-content');
  content.innerHTML = `
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
    <div style="text-align:center;margin-bottom:24px;">
      <div class="char-card-avatar ${char.avatarClass}" style="width:64px;height:64px;font-size:28px;margin:0 auto 12px;">${char.name[0]}</div>
      <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--gold-400);letter-spacing:0.08em;">${char.name}</h2>
      <div style="font-size:13px;color:var(--text-dim);margin-top:4px;">${char.title}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px;">
        ${ICONS.location} ${char.location}
      </div>
    </div>
    <div class="section-heading">前世宿命</div>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-bottom:20px;">${char.pastLife}</p>
    <div class="section-heading">当前境界</div>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:20px;">${char.realm}</p>
    <div class="section-heading">六维属性</div>
    ${char.stats.map(s => `
      <div class="stat-row" style="margin-bottom:10px;">
        <span class="stat-label">${s.key}</span>
        <div class="stat-track"><div class="stat-fill ${s.cls}" style="width:${s.value}%"></div></div>
        <span class="stat-value">${s.value}</span>
      </div>
    `).join('')}
    ${char.isDanger ? '<div style="margin-top:16px;padding:12px;border:1px solid var(--blood);border-radius:var(--radius-md);background:rgba(192,57,43,0.06);color:var(--blood-bright);font-size:13px;text-align:center;letter-spacing:0.06em;">⚠ 状态危急 — 精血严重不足，需立即援助</div>' : ''}
  `;
  overlay.classList.add('drawer-overlay--visible');
  content.classList.add('drawer--visible');
}

function openRealmModal(realmId) {
  const realm = WORLD_DATA.realms.find(r => r.id === realmId);
  if (!realm) return;
  openModal(realm.name, `
    <p style="color:${realm.corrupted ? 'var(--blood-bright)' : 'var(--text-secondary)'};line-height:1.8;margin-bottom:12px;">
      ${realm.corrupted ? '<strong>⚠ 此天域已被黑海侵蚀</strong><br>' : ''}${realm.desc}
    </p>
    <div style="font-size:12px;color:var(--text-dim);">连接天域：${realm.connections.map(cid => {
      const c = WORLD_DATA.realms.find(r2 => r2.id === cid);
      return c ? c.name : cid;
    }).join('、')}</div>
  `);
}

function openLocationDrawer(locId) {
  const loc = WORLD_DATA.sceneLocations.find(l => l.id === locId);
  if (!loc) return;
  const overlay = document.getElementById('drawer-overlay');
  const content = document.getElementById('drawer-content');
  const typeLabels = { city: '城池', rift: '裂隙', ruin: '遗迹', danger: '险地', sacred: '圣地' };
  content.innerHTML = `
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
    <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--gold-400);letter-spacing:0.08em;margin-bottom:8px;">${loc.name}</h2>
    <span style="font-size:11px;color:var(--text-muted);letter-spacing:0.08em;">${typeLabels[loc.type] || '地点'}</span>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-top:16px;">${loc.desc}</p>
    <div class="section-heading" style="margin-top:24px;">此处角色</div>
    <div style="font-size:13px;color:var(--text-dim);">
      ${Object.entries(WORLD_DATA.characterPositions).filter(([, pos]) => pos.sceneX === loc.x && pos.sceneY === loc.y).map(([charId]) => {
        const c = WORLD_DATA.characters.find(ch => ch.id === charId);
        return c ? `<div style="margin-bottom:4px;">${c.name}（${c.realm}）</div>` : '';
      }).join('') || '此地点暂无角色停留'}
    </div>
  `;
  overlay.classList.add('drawer-overlay--visible');
  content.classList.add('drawer--visible');
}

function openSkillDrawer(skillId) {
  const skill = WORLD_DATA.skillTree.find(s => s.id === skillId);
  if (!skill) return;
  const pct = Math.round(skill.progress / skill.max * 100);
  const overlay = document.getElementById('drawer-overlay');
  const content = document.getElementById('drawer-content');
  content.innerHTML = `
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
    <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--gold-400);letter-spacing:0.08em;margin-bottom:6px;">${skill.name}</h2>
    <span class="info-card-grade">${skill.grade}</span>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-top:16px;">${skill.desc}</p>
    <div style="margin-top:20px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px;">
        <span>修炼进度</span><span>${skill.progress} / ${skill.max} 重</span>
      </div>
      <div class="stat-track" style="height:6px;"><div class="stat-fill stat-fill--gold" style="width:${pct}%"></div></div>
    </div>
  `;
  overlay.classList.add('drawer-overlay--visible');
  content.classList.add('drawer--visible');
}

function closeDrawer() {
  const overlay = document.getElementById('drawer-overlay');
  const content = document.getElementById('drawer-content');
  overlay.classList.remove('drawer-overlay--visible');
  content.classList.remove('drawer--visible');
}

/* ===================================================================
   MODAL SYSTEM
   =================================================================== */
function openModal(title, bodyHTML) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 class="modal-header">${title}</h2>
    <div class="modal-body">${bodyHTML}</div>
  `;
  overlay.classList.add('modal-overlay--visible');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('modal-overlay--visible');
}

/* ===================================================================
   TOAST SYSTEM
   =================================================================== */
function showToast(type, title, message) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast--${type}`;
  const iconMap = {
    success: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="7 12 11 16 17 8"/></svg>`,
    warning: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    danger: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    info: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  };
  toast.innerHTML = `
    <div class="toast-icon">${iconMap[type] || iconMap.info}</div>
    <div class="toast-content">
      <div class="toast-title">${title}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast--fade-out');
    setTimeout(() => toast.remove(), 400);
  }, 3500);
}

/* ===================================================================
   INIT
   =================================================================== */
document.addEventListener('DOMContentLoaded', init);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    closeDrawer();
  }
  // Number keys to switch panels
  const num = parseInt(e.key);
  if (e.ctrlKey && num >= 1 && num <= NAV_ITEMS.length) {
    e.preventDefault();
    switchPanel(NAV_ITEMS[num - 1].id);
  }
});
</script>
</body>
</html>
