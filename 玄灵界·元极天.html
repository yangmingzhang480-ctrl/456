<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄灵界 · 元极天 — 众生皆在劫中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* =================================================================
   玄灵界·元极天 — Dark Fantasy Xianxia UI System
   UI/UX Pro Max — Premium Frontend Prototype v2
   ================================================================= */

/* ----- CSS Custom Properties ----- */
:root {
  --bg-abyss: #050308;
  --bg-void: #090714;
  --bg-panel: #0d0b18;
  --bg-card: #100e20;
  --bg-elevated: #15122e;
  --bg-hover: #1a1636;
  --gold-100: #fff8e7; --gold-200: #f5e6b8; --gold-300: #e8d48b;
  --gold-400: #d4af37; --gold-500: #b8860b; --gold-600: #8b6508; --gold-700: #6b4c0a;
  --gold-dim: rgba(180,130,50,0.25); --gold-glow: rgba(212,175,55,0.45); --gold-shimmer: rgba(212,175,55,0.1);
  --blood: #7a1515; --blood-bright: #c0392b; --blood-glow: rgba(192,57,43,0.4);
  --jade: #1a6b3c; --jade-bright: #2ecc71; --jade-glow: rgba(46,204,113,0.35);
  --amethyst: #5b3090; --amethyst-bright: #9b6dff;
  --ice: #2c5f8a; --ice-bright: #4da6ff;
  --text-primary: #d4c5a9; --text-secondary: #9d8f7a; --text-dim: #6b5f52; --text-muted: #3d3745;
  --border-subtle: rgba(180,130,50,0.1); --border-default: rgba(180,130,50,0.2);
  --border-gold: rgba(212,175,55,0.35); --border-bright: rgba(212,175,55,0.55);
  --border-danger: rgba(192,57,43,0.35);
  --radius-sm: 3px; --radius-md: 6px; --radius-lg: 10px; --radius-xl: 14px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring: cubic-bezier(0.25, 0.46, 0.45, 1.4);
  --duration-fast: 120ms; --duration-base: 250ms; --duration-slow: 500ms; --duration-glacial: 900ms;
  --font-display: 'Noto Serif SC','SimSun',serif;
  --font-body: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono: 'JetBrains Mono','Consolas',monospace;
  --font-calligraphy: 'Ma Shan Zheng','Noto Serif SC',cursive;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5),0 0 1px rgba(212,175,55,0.1);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6),0 0 8px rgba(212,175,55,0.1);
  --shadow-xl: 0 16px 60px rgba(0,0,0,0.7),0 0 20px rgba(212,175,55,0.12);
  --shadow-gold: 0 0 20px rgba(212,175,55,0.25),0 0 60px rgba(212,175,55,0.06);
  --shadow-blood: 0 0 16px rgba(192,57,43,0.3);
  --sidebar-width: 200px;
}

/* ----- Reset & Base ----- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-body);background:var(--bg-abyss);color:var(--text-primary);min-height:100vh;line-height:1.7;overflow-x:hidden;letter-spacing:0.02em}

/* ----- Multi-Layer Background System ----- */
.bg-abyss{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-abyss-layer-1{position:absolute;inset:-10%;
  background:radial-gradient(ellipse at 15% 20%,rgba(139,0,0,0.08) 0%,transparent 55%),
             radial-gradient(ellipse at 78% 55%,rgba(100,50,0,0.07) 0%,transparent 50%),
             radial-gradient(ellipse at 48% 82%,rgba(0,50,80,0.06) 0%,transparent 45%),
             radial-gradient(ellipse at 28% 48%,rgba(55,15,75,0.05) 0%,transparent 55%),
             radial-gradient(ellipse at 62% 18%,rgba(30,60,40,0.04) 0%,transparent 40%);
  animation:bg-drift 35s ease-in-out infinite}
.bg-abyss-layer-2{position:absolute;inset:-5%;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(212,175,55,0.012) 2px,rgba(212,175,55,0.012) 4px),
                   repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(180,130,50,0.015) 80px,rgba(180,130,50,0.015) 81px);
  animation:bg-scroll 55s linear infinite}
.bg-abyss-layer-3{position:absolute;inset:0;
  background:radial-gradient(circle at 60% 40%,rgba(212,175,55,0.03) 0%,transparent 30%),
             radial-gradient(circle at 22% 68%,rgba(192,57,43,0.025) 0%,transparent 25%),
             radial-gradient(circle at 82% 22%,rgba(46,204,113,0.015) 0%,transparent 20%),
             radial-gradient(circle at 40% 78%,rgba(155,109,255,0.015) 0%,transparent 22%);
  animation:bg-pulse 8s ease-in-out infinite alternate}
.bg-scale-overlay{position:absolute;inset:0;opacity:0.018;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 2 Q45 15 30 28 Q15 15 30 2z' fill='none' stroke='%23d4af37' stroke-width='0.5'/%3E%3Cpath d='M30 32 Q45 45 30 58 Q15 45 30 32z' fill='none' stroke='%23d4af37' stroke-width='0.5'/%3E%3C/svg%3E");
  background-size:60px 60px}
.bg-stars{position:absolute;inset:0}
.bg-star{position:absolute;width:1.5px;height:1.5px;background:var(--gold-400);border-radius:50%;
  animation:star-twinkle var(--twinkle-dur,3s) ease-in-out infinite;animation-delay:var(--twinkle-delay,0s);opacity:var(--twinkle-opacity,0.4)}
.bg-ash-container{position:absolute;inset:0}
.bg-ash{position:absolute;width:2px;height:2px;background:rgba(180,130,50,0.25);border-radius:1px;
  animation:ash-rise var(--ash-dur,14s) linear infinite;animation-delay:var(--ash-delay,0s);left:var(--ash-x,50%)}

/* ----- Layout ----- */
.app-layout{display:flex;min-height:100vh;position:relative;z-index:1}
.app-main{flex:1;margin-left:var(--sidebar-width);position:relative;overflow-y:auto;overflow-x:hidden;min-height:100vh}

/* ----- Sidebar Navigation ----- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-width);
  background:linear-gradient(175deg,rgba(14,12,26,0.98) 0%,rgba(10,8,18,0.99) 40%,rgba(6,4,10,0.995) 100%);
  border-right:1px solid var(--border-subtle);z-index:100;display:flex;flex-direction:column;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:2px 0 30px rgba(0,0,0,0.4)}
.sidebar::after{content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent 0%,var(--gold-400) 30%,var(--gold-400) 70%,transparent 100%);
  opacity:0.3;animation:sidebar-glow-line 4s ease-in-out infinite}
.sidebar-header{padding:28px 20px 16px;text-align:center;position:relative}
.sidebar-logo{font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:0.18em;
  background:linear-gradient(180deg,#f5e6b8 0%,#d4af37 40%,#8b6508 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 12px rgba(212,175,55,0.4));line-height:1.3}
.sidebar-subtitle{display:block;font-family:var(--font-display);font-size:12px;color:var(--text-dim);letter-spacing:0.25em;margin-top:2px}
.sidebar-divider{height:1px;margin:8px 20px;background:linear-gradient(90deg,transparent,var(--border-gold),transparent);opacity:0.4}
.sidebar-nav{flex:1;list-style:none;padding:4px 10px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:none;border-radius:var(--radius-md);
  background:transparent;color:var(--text-secondary);font-family:var(--font-body);font-size:13.5px;font-weight:400;
  cursor:pointer;transition:all var(--duration-base) var(--ease-out-expo);position:relative;overflow:hidden;
  letter-spacing:0.04em;text-align:left}
.nav-item::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(212,175,55,0.08),transparent 70%);
  opacity:0;transition:opacity var(--duration-base) var(--ease-out-expo)}
.nav-item:hover{color:var(--text-primary);background:rgba(212,175,55,0.04);transform:translateX(3px)}
.nav-item:hover::before{opacity:1}
.nav-item:active{transform:scale(0.98)}
.nav-item--active{color:#e8d48b;background:linear-gradient(90deg,rgba(212,175,55,0.12) 0%,rgba(212,175,55,0.03) 60%,transparent 100%);
  font-weight:500;text-shadow:0 0 16px rgba(212,175,55,0.25)}
.nav-item--active::after{content:'';position:absolute;left:0;top:25%;height:50%;width:2px;background:var(--gold-400);
  border-radius:0 2px 2px 0;box-shadow:0 0 10px var(--gold-glow)}
.nav-icon{flex-shrink:0;width:20px;height:20px;opacity:0.7;transition:opacity var(--duration-base) var(--ease-out-expo)}
.nav-item:hover .nav-icon,.nav-item--active .nav-icon{opacity:1}
.nav-label{white-space:nowrap}
.sidebar-footer{padding:12px 20px 20px;text-align:center}
.sidebar-footer-text{font-family:var(--font-display);font-size:10px;color:var(--text-muted);letter-spacing:0.2em}

/* ----- Panel System ----- */
.panel{display:none;min-height:100vh;padding:36px 44px;animation:panel-enter 0.45s var(--ease-out-expo)}
.panel--active{display:block}
.panel-header{margin-bottom:32px;position:relative}
.panel-title{font-family:var(--font-display);font-size:32px;font-weight:900;letter-spacing:0.1em;
  background:linear-gradient(180deg,#f0d890 0%,#c4a030 50%,#8b6910 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 8px rgba(212,175,55,0.2));margin-bottom:6px}
.panel-subtitle{font-family:var(--font-display);font-size:14px;color:var(--text-dim);letter-spacing:0.08em;padding-left:4px}
.panel-title-decoration{display:inline-block;width:36px;height:2px;background:linear-gradient(90deg,var(--gold-400),transparent);
  margin-right:12px;vertical-align:middle;border-radius:1px;box-shadow:0 0 8px rgba(212,175,55,0.3)}
.section-heading{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--gold-400);
  letter-spacing:0.08em;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:10px}
.section-heading::before{content:'';width:3px;height:18px;background:var(--gold-400);border-radius:2px;box-shadow:0 0 8px var(--gold-glow)}

/* ----- Character Cards ----- */
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.char-card{background:linear-gradient(175deg,var(--bg-card) 0%,var(--bg-panel) 100%);
  border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:24px 20px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:all var(--duration-base) var(--ease-out-expo);box-shadow:var(--shadow-md)}
.char-card::before{content:'';position:absolute;inset:0;border-radius:var(--radius-xl);
  border:1px solid transparent;
  background:linear-gradient(135deg,rgba(212,175,55,0.15) 0%,transparent 40%,rgba(180,130,50,0.05) 100%) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity var(--duration-base) var(--ease-out-expo)}
.char-card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(212,175,55,0.06) 0%,transparent 60%);opacity:0;
  transition:opacity var(--duration-slow) var(--ease-out-expo)}
.char-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-xl),var(--shadow-gold);border-color:var(--border-gold)}
.char-card:hover::before{opacity:1}
.char-card:hover::after{opacity:1}
.char-card:active{transform:scale(0.97) translateY(-4px)}
.char-card--danger{border-color:var(--border-danger)!important;box-shadow:var(--shadow-md),var(--shadow-blood);animation:danger-pulse 3s ease-in-out infinite}
.char-card-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:24px;font-weight:900;position:relative;z-index:1}
.char-card-avatar::before{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:2px solid var(--border-gold);animation:avatar-ring 3s ease-in-out infinite}
.char-card-avatar::after{content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(212,175,55,0.12);animation:avatar-ring 4s ease-in-out 1s infinite}
.char-card-avatar--gold{color:#d4af37;background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(100,60,0,0.1))}
.char-card-avatar--ice{color:#4da6ff;background:linear-gradient(135deg,rgba(77,166,255,0.15),rgba(40,80,120,0.1))}
.char-card-avatar--jade{color:#2ecc71;background:linear-gradient(135deg,rgba(46,204,113,0.15),rgba(20,80,40,0.1))}
.char-card-avatar--amethyst{color:#9b6dff;background:linear-gradient(135deg,rgba(155,109,255,0.15),rgba(60,30,100,0.1))}
.char-card-name{font-family:var(--font-display);font-size:18px;font-weight:700;text-align:center;
  letter-spacing:0.08em;color:var(--text-primary);margin-bottom:4px}
.char-card-title{font-size:12px;color:var(--text-dim);text-align:center;letter-spacing:0.06em;margin-bottom:14px}
.char-card-location{font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:16px;
  letter-spacing:0.04em;display:flex;align-items:center;justify-content:center;gap:4px}
.char-card-past-life{font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:14px;
  letter-spacing:0.04em;font-style:italic;opacity:0.7;border-top:1px solid var(--border-subtle);padding-top:10px}
.stat-list{display:flex;flex-direction:column;gap:8px}
.stat-row{display:flex;align-items:center;gap:8px}
.stat-label{width:36px;font-size:11px;color:var(--text-dim);text-align:right;flex-shrink:0;letter-spacing:0.05em}
.stat-track{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;position:relative}
.stat-fill{height:100%;border-radius:2px;position:relative;transition:width 1.2s var(--ease-out-expo)}
.stat-fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  animation:bar-shimmer 2.5s ease-in-out infinite}
.stat-fill--gold{background:linear-gradient(90deg,#8b6508,#d4af37)}
.stat-fill--blood{background:linear-gradient(90deg,#6b1010,#c0392b)}
.stat-fill--jade{background:linear-gradient(90deg,#0f5c2e,#2ecc71)}
.stat-fill--ice{background:linear-gradient(90deg,#1a4a6e,#4da6ff)}
.stat-fill--amethyst{background:linear-gradient(90deg,#4a2080,#9b6dff)}
.stat-fill--gold-warm{background:linear-gradient(90deg,#8b5a08,#e8a817)}
.stat-value{width:36px;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);flex-shrink:0}
.char-card-danger-badge{position:absolute;top:12px;right:12px;
  font-family:var(--font-display);font-size:10px;letter-spacing:0.1em;color:var(--blood-bright);
  padding:2px 8px;border:1px solid var(--blood);border-radius:2px;
  background:rgba(192,57,43,0.08);animation:danger-blink 2s ease-in-out infinite}

/* ----- Map System ----- */
.map-container{position:relative;
  background:linear-gradient(175deg,rgba(14,12,26,0.8),rgba(10,8,18,0.9));
  border:1px solid var(--border-default);border-radius:var(--radius-xl);
  overflow:hidden;box-shadow:var(--shadow-lg)}
.map-toolbar{display:flex;gap:6px;padding:14px 18px;border-bottom:1px solid var(--border-subtle);
  background:rgba(6,4,10,0.6);backdrop-filter:blur(6px)}
.map-toggle-btn{padding:7px 16px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:12.5px;
  cursor:pointer;transition:all var(--duration-fast) var(--ease-out-expo);letter-spacing:0.05em}
.map-toggle-btn:hover{color:var(--text-primary);border-color:var(--border-gold);background:rgba(212,175,55,0.05)}
.map-toggle-btn--active{color:var(--gold-400);border-color:var(--border-gold);
  background:rgba(212,175,55,0.08);box-shadow:0 0 10px rgba(212,175,55,0.1)}
.map-stage{position:relative;width:100%;min-height:520px;overflow:hidden}
.map-macro{position:relative;width:100%;height:520px}
.map-macro svg{width:100%;height:100%}
.map-micro{position:relative;width:100%;height:520px;
  background:radial-gradient(ellipse at center,rgba(20,15,30,0.6) 0%,rgba(6,4,10,0.95) 70%);overflow:hidden}
.map-micro-canvas{width:100%;height:100%}

/* Map tooltip */
.map-tooltip{position:absolute;padding:14px 18px;
  background:rgba(14,12,26,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-gold);border-radius:var(--radius-lg);color:var(--text-primary);
  font-family:var(--font-body);font-size:13px;pointer-events:none;z-index:50;
  opacity:0;transition:opacity var(--duration-fast) var(--ease-out-expo);
  box-shadow:var(--shadow-xl);max-width:280px}
.map-tooltip--visible{opacity:1}
.map-tooltip-title{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--gold-400);margin-bottom:4px;letter-spacing:0.06em}
.map-tooltip-desc{font-size:12px;color:var(--text-dim);line-height:1.6}

/* ----- Cards (Inventory / Skills) ----- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.info-card{background:linear-gradient(170deg,var(--bg-card) 0%,var(--bg-panel) 100%);
  border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;
  transition:all var(--duration-base) var(--ease-out-expo);cursor:pointer;
  position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.info-card::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.04),transparent);transition:left 0.6s ease}
.info-card:hover{transform:translateY(-4px);border-color:var(--border-gold);box-shadow:var(--shadow-lg),0 0 16px rgba(212,175,55,0.08)}
.info-card:hover::after{left:100%}
.info-card:active{transform:scale(0.98)}
.info-card-name{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:6px;letter-spacing:0.04em}
.info-card-grade{display:inline-block;font-size:10px;padding:2px 8px;border:1px solid var(--gold-500);
  border-radius:2px;color:var(--gold-400);letter-spacing:0.08em;margin-bottom:8px;background:rgba(180,130,50,0.06)}
.info-card-grade--saint{border-color:#ffd700;color:#ffd700;background:rgba(255,215,0,0.06)}
.info-card-grade--emperor{border-color:#ff6347;color:#ff6347;background:rgba(255,99,71,0.06)}
.info-card-grade--heaven{border-color:#d4af37;color:#d4af37}
.info-card-grade--earth{border-color:#9b6dff;color:#9b6dff;background:rgba(155,109,255,0.06)}
.info-card-grade--mystic{border-color:#4da6ff;color:#4da6ff;background:rgba(77,166,255,0.06)}
.info-card-desc{font-size:13px;color:var(--text-dim);line-height:1.7}
.info-card-type{display:inline-block;margin-top:10px;font-size:11px;color:var(--text-muted);
  padding:2px 8px;border:1px solid var(--border-subtle);border-radius:2px;letter-spacing:0.04em}
.info-card-corner{position:absolute;top:0;right:0;width:40px;height:40px;overflow:hidden}
.info-card-corner::after{content:'';position:absolute;top:-20px;right:-20px;width:40px;height:40px;
  background:var(--gold-400);transform:rotate(45deg);opacity:0.06}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state-icon{font-family:var(--font-display);font-size:48px;opacity:0.12;margin-bottom:16px}
.empty-state-text{font-family:var(--font-display);font-size:15px;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:8px}
.empty-state-desc{font-size:12px;color:var(--text-muted);letter-spacing:0.04em}

/* ----- Modal / Drawer System ----- */
.modal-overlay{position:fixed;inset:0;background:rgba(3,2,6,0.84);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--duration-base) var(--ease-out-expo)}
.modal-overlay--visible{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(175deg,var(--bg-panel) 0%,var(--bg-card) 100%);
  border:1px solid var(--border-gold);border-radius:var(--radius-xl);padding:36px;
  max-width:640px;width:90vw;max-height:82vh;overflow-y:auto;
  box-shadow:var(--shadow-xl),var(--shadow-gold);position:relative;
  animation:modal-enter 0.4s var(--ease-out-back)}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;
  border:1px solid var(--border-subtle);border-radius:50%;background:transparent;
  color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--duration-fast) var(--ease-out-expo)}
.modal-close:hover{color:var(--text-primary);border-color:var(--border-gold);background:rgba(212,175,55,0.06)}
.modal-header{font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--gold-400);
  letter-spacing:0.08em;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}
.modal-body{font-size:14px;color:var(--text-secondary);line-height:1.8}
.modal-body strong{color:var(--text-primary)}

/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(3,2,6,0.6);z-index:200;
  opacity:0;pointer-events:none;transition:opacity var(--duration-base) var(--ease-out-expo)}
.drawer-overlay--visible{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:92vw;
  background:linear-gradient(180deg,var(--bg-panel) 0%,var(--bg-abyss) 100%);
  border-left:1px solid var(--border-gold);padding:32px 28px;overflow-y:auto;z-index:201;
  box-shadow:-8px 0 40px rgba(0,0,0,0.5);
  transform:translateX(100%);transition:transform 0.4s var(--ease-out-expo)}
.drawer--visible{transform:translateX(0)}
.drawer-close{position:absolute;top:14px;right:14px;width:32px;height:32px;
  border:1px solid var(--border-subtle);border-radius:50%;background:transparent;
  color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--duration-fast) var(--ease-out-expo)}
.drawer-close:hover{color:var(--text-primary);border-color:var(--border-gold)}

/* ----- Toast System ----- */
.toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{pointer-events:auto;min-width:340px;max-width:460px;padding:16px 20px;
  background:rgba(14,12,26,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius-lg);border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-xl);display:flex;align-items:flex-start;gap:12px;
  animation:toast-in 0.45s var(--ease-out-back);position:relative;overflow:hidden}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.toast--success::before{background:var(--jade-bright)}
.toast--warning::before{background:#e67e22}
.toast--danger::before{background:var(--blood-bright)}
.toast--info::before{background:var(--gold-400)}
.toast--fade-out{opacity:0;transform:translateX(100px);transition:all var(--duration-base) var(--ease-out-expo)}
.toast-icon{flex-shrink:0;width:20px;height:20px;margin-top:1px}
.toast-content{flex:1}
.toast-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:0.04em;margin-bottom:2px}
.toast-message{font-size:12.5px;color:var(--text-dim);line-height:1.5}

/* ----- Buttons ----- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--border-default);
  border-radius:var(--radius-md);background:var(--bg-card);color:var(--text-secondary);
  font-family:var(--font-body);font-size:13.5px;cursor:pointer;
  transition:all var(--duration-fast) var(--ease-out-expo);letter-spacing:0.04em;position:relative;overflow:hidden}
.btn:hover{color:var(--text-primary);border-color:var(--border-gold);box-shadow:0 0 14px var(--gold-shimmer)}
.btn:active{transform:scale(0.97)}
.btn--primary{background:linear-gradient(135deg,rgba(212,175,55,0.12),rgba(180,130,50,0.06));
  border-color:var(--border-gold);color:var(--gold-400);font-weight:500}
.btn--primary:hover{background:linear-gradient(135deg,rgba(212,175,55,0.2),rgba(180,130,50,0.1));box-shadow:var(--shadow-gold)}
.btn--danger{border-color:var(--border-danger);color:var(--blood-bright)}
.btn--danger:hover{background:rgba(192,57,43,0.08);box-shadow:var(--shadow-blood)}
.btn--sm{padding:6px 14px;font-size:12px}
.btn .btn-svg{width:16px;height:16px}

/* ----- Form Elements ----- */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.05em}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);background:rgba(10,8,18,0.6);color:var(--text-primary);
  font-family:var(--font-body);font-size:14px;transition:all var(--duration-fast) var(--ease-out-expo);outline:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--border-gold);box-shadow:0 0 0 3px rgba(212,175,55,0.08)}
.form-textarea{resize:vertical;min-height:100px;font-family:var(--font-mono);font-size:12px}
.form-select{cursor:pointer}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:0.03em}

/* ----- Chat / Game Interface ----- */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 140px);max-width:780px}
.chat-messages{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px}
.chat-bubble{max-width:78%;padding:16px 20px;border-radius:var(--radius-lg);line-height:1.9;font-size:15px;animation:msg-enter 0.35s var(--ease-out-expo)}
.chat-bubble--user{align-self:flex-end;
  background:linear-gradient(135deg,rgba(120,80,180,0.15),rgba(100,60,160,0.06));
  border:1px solid rgba(155,109,255,0.2);border-radius:12px 12px 4px 12px}
.chat-bubble--assistant{align-self:flex-start;
  background:linear-gradient(135deg,rgba(20,15,30,0.8),rgba(16,12,26,0.6));
  border:1px solid var(--border-subtle);border-radius:12px 12px 12px 4px;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.chat-bubble--system{align-self:center;max-width:90%;font-size:13px;color:var(--text-dim);text-align:center;
  background:transparent;border:none;font-style:italic;letter-spacing:0.06em;padding:8px 20px}
.chat-input-area{display:flex;gap:10px;padding:16px 0;border-top:1px solid var(--border-subtle)}
.chat-input{flex:1;padding:12px 16px;border:1px solid var(--border-gold);border-radius:var(--radius-md);
  background:var(--bg-panel);color:var(--text-primary);font-family:var(--font-display);font-size:15px;
  outline:none;transition:all var(--duration-fast) var(--ease-out-expo);resize:none}
.chat-input:focus{border-color:var(--gold-400);box-shadow:0 0 20px rgba(212,175,55,0.15)}
.chat-options{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.chat-option-btn{text-align:left;padding:12px 18px;border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);background:rgba(212,175,55,0.03);color:var(--text-secondary);
  font-family:var(--font-display);font-size:14px;cursor:pointer;
  transition:all var(--duration-fast) var(--ease-out-expo);letter-spacing:0.03em}
.chat-option-btn:hover{border-color:var(--border-gold);background:rgba(212,175,55,0.08);
  color:var(--gold-400);transform:translateX(6px);box-shadow:0 0 16px rgba(212,175,55,0.08)}
.streaming-indicator{display:flex;align-items:center;gap:6px;padding:12px 16px;color:var(--gold-400);font-size:13px}
.streaming-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-400);animation:streaming-bounce 1s ease-in-out infinite}
.streaming-dot:nth-child(2){animation-delay:0.15s}
.streaming-dot:nth-child(3){animation-delay:0.3s}
.thinking-fold{margin:8px 0}
.thinking-fold summary{font-size:13px;color:var(--text-muted);cursor:pointer;letter-spacing:0.05em;padding:4px 0;transition:color var(--duration-fast);list-style:none}
.thinking-fold summary:hover{color:var(--text-dim)}
.thinking-fold .content{font-size:13px;color:var(--text-dim);padding:10px 14px;background:rgba(255,255,255,0.015);
  border-radius:var(--radius-md);white-space:pre-wrap;max-height:180px;overflow-y:auto;
  border-left:2px solid var(--border-subtle);font-style:italic;margin-top:4px}

/* ----- Settings Status Indicator ----- */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.status-dot--connected{background:var(--jade-bright);box-shadow:0 0 6px var(--jade-glow)}
.status-dot--disconnected{background:var(--text-muted)}
.import-result{padding:12px 16px;border-radius:var(--radius-md);font-size:13px;margin-top:12px;line-height:1.6}
.import-result--success{border:1px solid rgba(46,204,113,0.2);background:rgba(46,204,113,0.05);color:var(--jade-bright)}
.import-result--error{border:1px solid rgba(192,57,43,0.2);background:rgba(192,57,43,0.05);color:var(--blood-bright)}

/* ----- Scrollbar ----- */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(180,130,50,0.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(180,130,50,0.3)}

/* ----- Keyframes ----- */
@keyframes bg-drift{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(1%,-0.5%) scale(1.02)}50%{transform:translate(-0.5%,1%) scale(1.01)}75%{transform:translate(-1%,-1%) scale(1.03)}}
@keyframes bg-scroll{from{transform:translateY(0)}to{transform:translateY(-80px)}}
@keyframes bg-pulse{0%{opacity:0.5}100%{opacity:1}}
@keyframes star-twinkle{0%,100%{opacity:0.15}50%{opacity:0.7}}
@keyframes ash-rise{0%{transform:translateY(105vh) translateX(0);opacity:0}10%{opacity:0.5}90%{opacity:0.15}100%{transform:translateY(-5vh) translateX(var(--ash-drift,20px));opacity:0}}
@keyframes sidebar-glow-line{0%,100%{opacity:0.15}50%{opacity:0.5}}
@keyframes avatar-ring{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes danger-pulse{0%,100%{box-shadow:var(--shadow-md),0 0 8px rgba(192,57,43,0.2)}50%{box-shadow:var(--shadow-md),0 0 24px rgba(192,57,43,0.5)}}
@keyframes danger-blink{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes bar-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes panel-enter{from{opacity:0;transform:translateY(16px);filter:blur(2px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes modal-enter{from{opacity:0;transform:scale(0.92) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes toast-in{from{opacity:0;transform:translateX(120px) scale(0.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes msg-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes streaming-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ley-line-flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes corruption-flicker{0%,88%,100%{opacity:1}90%,94%{opacity:0.3}}
@keyframes token-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes gold-shine{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes node-glow-pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(212,175,55,0.3))}50%{filter:drop-shadow(0 0 12px rgba(212,175,55,0.6))}}

/* ----- Responsive ----- */
@media(max-width:1200px){.char-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){:root{--sidebar-width:56px}.sidebar-logo{font-size:18px}.sidebar-subtitle,.nav-label,.sidebar-footer-text{display:none}.nav-item{justify-content:center;padding:12px}.panel{padding:20px}.panel-title{font-size:24px}.char-grid{grid-template-columns:1fr}.drawer{width:100vw}.map-stage{min-height:360px}}
</style>

function updateNav() {
  document.querySelectorAll('.nav-item').forEach(b=>{
    const is=b.id==='nav-'+activePanel;
    b.classList.toggle('nav-item--active',is);b.setAttribute('aria-current',is?'page':'false');
  });
}

function switchPanel(id) {
  activePanel=id;updateNav();
  const m=document.getElementById('app-main');
  switch(id){
    case'monitor':m.innerHTML=P_monitor();break;
    case'map':m.innerHTML=P_map();initMapPanel();break;
    case'skills':m.innerHTML=P_skills();break;
    case'inventory':m.innerHTML=P_inventory();break;
    case'chat':m.innerHTML=P_chat();initChatPanel();break;
    case'settings':m.innerHTML=P_settings();break;
  }
}

/* ---- Macro Map (Realm View) ---- */
function M_macro() {
  const W=800,H=520,realms=WD.realms,pos=WD.charPos;
  const off={luxingyao:[-24,-24],limingyuan:[18,-20],yexilan:[22,18],chulingshuang:[-20,20]};
  const lines=realms.flatMap(r=>r.cs.map(cid=>{const t=realms.find(x=>x.id===cid);if(!t)return'';return`<line x1="${r.x/100*W}" y1="${r.y/100*H}" x2="${t.x/100*W}" y2="${t.y/100*H}" class="ley-line" stroke="rgba(212,175,55,0.15)" stroke-width="1" stroke-dasharray="6 4"/>`;})).join('');
  const nodes=realms.map(r=>{
    const cx=r.x/100*W,cy=r.y/100*H;
    const shape=r.cor
      ?`<polygon points="0,-24 22,-8 14,20 -14,20 -22,-8" fill="rgba(139,0,0,0.12)" stroke="#8b0000" stroke-width="1.5" class="realm-node realm-node--corrupted"/>`
      :`<polygon points="0,-24 22,-8 14,20 -14,20 -22,-8" fill="rgba(212,175,55,0.06)" stroke="#d4af37" stroke-width="1.5" class="realm-node" style="animation:node-glow-pulse 3s ease-in-out infinite"/>`;
    return`<g transform="translate(${cx},${cy})" onmouseenter="showMapTooltip(event,'${r.name}','${r.d}')" onmouseleave="hideMapTooltip()" onclick="openRealmModal('${r.id}')">${shape}<text y="6" text-anchor="middle" class="realm-label" font-size="12">${r.name}</text></g>`;
  }).join('');
  const tokens=Object.entries(pos).map(([cid,p])=>{
    const ch=WD.characters.find(c=>c.id===cid);if(!ch)return'';
    const r=realms.find(x=>x.id===p.realm);if(!r)return'';
    const rx=r.x/100*W,ry=r.y/100*H,[ox,oy]=off[cid]||[0,0];
    const tc={gold:'#d4af37',ice:'#4da6ff',jade:'#2ecc71',amethyst:'#9b6dff'}[ch.tk]||'#d4af37';
    return`<g transform="translate(${rx+ox},${ry+oy})" style="animation:token-float 3s ease-in-out infinite"><circle r="14" fill="rgba(0,0,0,0.55)" stroke="${tc}" stroke-width="2"/><circle r="8" fill="none" stroke="${tc}" stroke-width="0.5" opacity="0.5"/><text y="5.5" text-anchor="middle" font-family="var(--font-display)" font-size="13" font-weight="900" fill="#fff">${ch.name[0]}</text></g>`;
  }).join('');
  return`<div class="map-macro" id="map-macro"><svg viewBox="0 0 ${W} ${H}"><defs><radialGradient id="corr-grad" cx="48%" cy="42%"><stop offset="0%" stop-color="rgba(139,0,0,0.1)"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#corr-grad)"/>${lines}${nodes}${tokens}<g transform="translate(630,470)"><rect x="0" y="0" width="155" height="42" rx="4" fill="rgba(6,4,10,0.75)" stroke="rgba(180,130,50,0.15)"/><circle cx="15" cy="15" r="4.5" fill="rgba(0,0,0,0.5)" stroke="#d4af37" stroke-width="1.5"/><text x="26" y="19" font-size="10" fill="#9d8f7a" font-family="var(--font-body)">角色令牌</text><polygon points="75,7 85,15 75,23" fill="rgba(139,0,0,0.2)" stroke="#8b0000" stroke-width="1.2"/><text x="96" y="19" font-size="10" fill="#9d8f7a" font-family="var(--font-body)">黑海侵蚀</text></g></svg></div>`;
}

function M_micro() {
  const W=800,H=520,locs=WD.scenes,pos=WD.charPos;

    return`<g transform="translate(${p.sx},${p.sy})" style="animation:token-float 3s ease-in-out infinite;cursor:pointer" onclick="openCharDrawer('${cid}')"><circle r="13" fill="rgba(0,0,0,0.55)" stroke="${tc}" stroke-width="2"/><circle r="7" fill="none" stroke="${tc}" stroke-width="0.5" opacity="0.4"/><text y="5" text-anchor="middle" font-family="var(--font-display)" font-size="13" font-weight="900" fill="#fff">${ch.name[0]}</text></g>`;

}

function showToast(type,title,message){
  const ct=document.getElementById('toast-container'),t=document.createElement('div');t.className=`toast toast--${type}`;
  const icons={success:S.toast_success,warning:S.toast_warn,danger:S.toast_danger,info:S.toast_info};
  t.innerHTML=`<div class="toast-icon">${icons[type]||icons.info}</div><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div>`;
  ct.appendChild(t);setTimeout(()=>{t.classList.add('toast--fade-out');setTimeout(()=>t.remove(),400);},3500);
}

function triggerImport(type){importType=type;document.getElementById('import-file-input').click();}
function handleFileImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{processImport(JSON.parse(ev.target.result),importType)}catch(err){const el=document.getElementById('import-status');if(el)el.innerHTML=`<div class="import-result import-result--error">✘ JSON 格式解析错误：${err.message}</div>`;showToast('danger','导入失败',err.message)}};r.readAsText(f);e.target.value='';}
function processImport(data,type){const el=document.getElementById('import-status');if(!el)return;try{if(type==='lorebook'||(data.entries&&typeof data.entries==='object')){const n=data.name||'导入的世界书',entries=Array.isArray(data.entries)?data.entries:Object.values(data.entries);el.innerHTML=`<div class="import-result import-result--success">✓ 成功导入世界书「${n}」— ${entries.length} 条天道法则</div>`;showToast('success','世界书已导入',`「${n}」包含 ${entries.length} 条法则条目`)}else if(type==='preset'||data.settings||data.prompts){const n=data.name||'导入的预设';el.innerHTML=`<div class="import-result import-result--success">✓ 成功导入预设「${n}」</div>`;showToast('success','预设已导入',`「${n}」已加入天道法则`)}else if(type==='backup'||data.version||data.lorebooks){const lb=data.lorebooks?.length||0,pc=data.presets?.length||0;el.innerHTML=`<div class="import-result import-result--success">✓ 备份已恢复 — ${lb} 本世界书, ${pc} 个预设</div>`;showToast('success','备份已恢复',`恢复了 ${lb} 本世界书与 ${pc} 个预设`)}else{el.innerHTML=`<div class="import-result import-result--success">✓ JSON 数据已成功加载</div>`;showToast('info','导入完成','数据已成功加载')}}catch(err){el.innerHTML=`<div class="import-result import-result--error">✘ 导入处理失败：${err.message}</div>`;showToast('danger','导入失败',err.message)}}
function exportAll(){const ed={version:'3.0.0',name:'玄灵界·元极天 数据备份',exportedAt:new Date().toISOString(),characters:WD.characters,realms:WD.realms,inventory:WD.inventory,skillTree:WD.skills};const blob=new Blob([JSON.stringify(ed,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='玄灵界·元极天_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);showToast('success','导出成功','天道法则已导出为 JSON 文件');}

/* ===================================================================
   INIT
   =================================================================== */
function init(){for(let i=0;i<60;i++){const s=document.createElement('div');s.className='bg-star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--twinkle-dur',(2+Math.random()*5)+'s');s.style.setProperty('--twinkle-delay',Math.random()*4+'s');s.style.setProperty('--twinkle-opacity',(0.12+Math.random()*0.45).toString());document.getElementById('bg-stars').appendChild(s)}for(let i=0;i<25;i++){const a=document.createElement('div');a.className='bg-ash';a.style.setProperty('--ash-x',Math.random()*100+'%');a.style.setProperty('--ash-dur',(10+Math.random()*20)+'s');a.style.setProperty('--ash-delay',Math.random()*10+'s');a.style.setProperty('--ash-drift',(Math.random()-0.5)*60+'px');document.getElementById('bg-ash').appendChild(a)}renderSidebar();switchPanel('monitor');}
document.addEventListener('DOMContentLoaded',init);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeDrawer()}const n=parseInt(e.key);if(e.ctrlKey&&n>=1&&n<=NAV.length){e.preventDefault();switchPanel(NAV[n-1].id)}});
</script>
